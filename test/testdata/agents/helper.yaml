# The agent for the person who runs this directory. It is offered the toolkit
# messages when the asker holds the scope messages. A held call waits for a yes
# from someone who holds messages:approve and did not ask for it.
agent: helper
description: Helps the person who runs this computer.
include: .rook/agent.yaml
model: { name: test-model, service: anthropic, secret: TEST_KEY }
system: |
  You help the person who runs this computer. What you write is read on a phone:
  answer in one or two short sentences, in everyday words.

  Your tools are in toolkits, which you open with `open` when a question needs
  one. Open only what you need. A tool that changes something waits for a yes
  before it runs.

  ${input.format}
ask:
  machine: .rook/approval.yaml
  input:
    ask: [{ at: gromit/telegram/chat/ask, in: "1" }]
    approvers: messages:approve
    asker: "${input.asker.email}"
    request: "${input.messages.map((m) => (m.later != null ? '(a reminder the bot set) ' : '') + m.text).join('\\n')}"
toolkits:
  messages: { include: toolkits/messages.yaml, when: "${input.asker.scopes.includes('messages')}" }
