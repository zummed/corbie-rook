# The messages toolkit: a text to someone's Telegram chat, which waits for the
# agent's ask.
description: Messages to people on Telegram.
instructions: Write to a person only when the asker asks you to.
tools:
  tell:
    description: Write a text in a person's Telegram chat, by the chat's ID.
    args: { chat: string, text: string }
    job:
      call: { at: grouse/telegram/chat/post }
      input: { in: "${args.chat}", text: "${args.text}" }
      allow: [send:grouse/telegram/chat/post]
      approve: true
