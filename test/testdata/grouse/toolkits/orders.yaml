# The orders app. read_file is offered with the toolkit; change_file only to a
# person whose scopes hold orders:write, and it waits for the agent's ask,
# which asks in #orders-team.
description: The orders app. How it is deployed, its settings, and changing them.
instructions: { include: ./orders.md }
tools:
  read_file: { call: grouse/gitlab/repository/files/read, input: { project: group/orders } }
  change_file:
    call: grouse/gitlab/repository/commits/create
    input: { project: group/orders }
    approve: true
    when: "${input.asker.scopes.includes('orders:write')}"
