# Rook's question. It takes calls only from the locations in receive:, and an
# answer only from the router at `router`, which sends each press of its
# buttons to `answers`. An agent's approval calls it from agents/, and the
# approval of deploys from deploys. It takes close from the ballot, and calls
# the lookup at `lookup` for who answered, and its service's part at `show`.
include: .rook/chat/ask.yaml
receive: [answers, agents/*, ballot, deploys]
input:
  properties:
    router: { const: gromit/slack/gromit, default: gromit/slack/gromit }
    lookup: { const: people/find, default: people/find }
    show: { const: gromit/slack/chat/show, default: gromit/slack/chat/show }
