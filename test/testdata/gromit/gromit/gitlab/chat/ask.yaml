# Rook's question. It takes calls only from the locations in receive:, and an
# answer only from the router at `router`, which sends it each comment that
# answers it. An agent's approval calls it from agents/. A machine elsewhere
# that calls it, or whose ask: is the approval, such as a statechart with an
# approve: job, calls it from its own location, which must be added to
# receive:, or the call is refused. It takes close from the ballot, and calls
# the lookup at `lookup` for who answered, and its service's part at `show`.
include: .rook/chat/ask.yaml
receive: [gromit/gitlab/gromit, agents/*, ballot]
input:
  properties:
    router: { const: gromit/gitlab/gromit, default: gromit/gitlab/gromit }
    lookup: { const: people/find, default: people/find }
    show: { const: gromit/gitlab/chat/show, default: gromit/gitlab/chat/show }
