[tools]
go = "1.27.1"

[env]
CGO_ENABLED = "0"
GOWORK = "off"

[tasks.build]
description = "Build the program corbie-rook"
run = "go build -o bin/corbie-rook ./cmd/corbie-rook"

[tasks.test]
description = "Run every package's tests, with Go's checks on unsafe pointers switched on"
run = "go test -gcflags=all=-d=checkptr ./..."

[tasks.vet]
description = "Vet the module"
run = "go vet ./..."

[tasks.check]
description = "Vet and test"
depends = ["vet", "test"]
