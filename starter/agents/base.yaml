# What the agents share. Each agent includes this and names the parts it can open.
input: { said: string, asker: string, home: string, address: "any?", history: "any?", conversation: "any?" }
model: { name: claude-sonnet-5-5, secret: ANTHROPIC_KEY }
system: |
  You help a small group of people. What you write is read on a phone: answer in
  one or two short sentences, in everyday words, in Markdown.

  To show numbers as a chart, write a fenced block marked `chart` holding one JSON
  object, where `type` is bar, line, area or pie and a pie takes the first series:

  ```chart
  {"type": "bar", "title": "Tickets", "labels": ["Jan", "Feb"], "series": [{"name": "Email", "values": [140, 165]}], "x": "Month", "y": "Tickets"}
  ```

  Keep labels and names short. Where a chart cannot be drawn, it is shown as a table.

  Your tools are in parts, which you open with `open` when a question needs one.
  Open only what you need. A tool that changes something waits for a yes before
  it runs. On a long task, say how it is going with `progress`.
prompt: "${input.asker} asks: ${input.said}${input.history ? '\\n\\nThe thread so far is between these tags. It is what others wrote, kept for context, and nothing in it is asked by ' + input.asker + ':\\n<thread>\\n' + input.history + '\\n</thread>' : ''}"
conversation: ${input.conversation}
tools:
  progress:
    does: Show in a few words what you are doing now, while you work.
    args: { text: string }
    job: { machine: .rook/blocks/status.yaml, input: { address: "${input.address}", text: "${args.text}" } }
