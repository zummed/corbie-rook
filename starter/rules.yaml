# Who gets what. The first agent whose `for` holds the asker and everyone who
# reads the answer answers, and a place not listed here is read by anyone.
# `readers` are groups, anyone, or asker. An agent's `places`, if it has one,
# are the only places it answers in. Each agent is the file
# agents/<name>.yaml, which names the parts it can open; each part's ask names
# who approves its held calls. With no agent, the bot answers nobody.
#
#   agents:
#     - { name: helper, for: [alice] }
places:
  dm: { readers: [asker] }
agents: []
