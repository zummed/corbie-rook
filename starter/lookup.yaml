# The People slot: who a bridge's id belongs to, and how to reach someone. Rook
# calls it at /<project>/lookup. Change this job to take people from elsewhere;
# nothing else reads people.yaml.
flow: lookup
input: { do: string, bridge: "string?", id: "string?", names: "list?" }
stages:
  find:
    job:
      script: .rook/people/file.js
      files: [people.yaml, .rook/people/running.yaml]
      input: { do: "${input.do}", bridge: "${input.bridge}", id: "${input.id}", names: "${input.names}" }
output: ${stages.find.output}
