# The router of BOT on GitLab. It runs Rook's GitLab listener as a child, and
# sends each comment that names the bot, and each opened issue that does, to the
# conversation, keyed by the issue, the person and the agent. The host is the
# value GITLAB_SITE and the token the secret GITLAB_TOKEN, set at
# /<project>/BOT/gitlab. Set the projects the listener reads. Add
# `settle: 2m` to its input to hear an opened issue once nobody has changed it
# for two minutes, and `overhear: true` to hear every issue and comment, marked
# unaddressed, which this router drops.
statechart: BOT
description: The router of BOT on GitLab.
lifetime: singleton
allow: [send:conversation]
initial: listening
states:
  listening:
    job:
      machine: .rook/gitlab/listen.yaml
      input: { projects: [group/project] }
      restart: { after: always }
    on:
      message:
        when: "${!event.data.unaddressed && !event.data.change && !event.data.own}"
        send: { to: { at: conversation, key: "${'gitlab:' + event.data.chat + ':' + event.data.user + ':assistant'}" }, event: message, data: "${event.data}" }
