# Rook's question. It takes calls only from the locations in receive:, and an
# answer only from the router at `router`, which sends it each tap on its
# buttons. An agent's approval calls it from agents/. A machine elsewhere that
# calls it, or whose ask: is the approval, such as a statechart with an
# approve: job, calls it from its own location, which must be added to
# receive:, or the call is refused. It takes close from the ballot, and calls
# the lookup at `lookup` for who answered.
include: .rook/telegram/chat/ask.yaml
receive: [BOT/telegram/BOT, agents/*, ballot]
input:
  properties:
    router: { const: BOT/telegram/BOT, default: BOT/telegram/BOT }
    lookup: { const: people/find, default: people/find }
