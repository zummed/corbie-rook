# Rook's approval, which a machine names as its ask. It asks the question in
# every place of `ask` at once, each a bot's placed chat/ask, with yes and no,
# naming the machine that asks, each held job, who asked and what was asked.
# Corbie gives it `asking` and `jobs`; the ask's input gives the rest:
#
#   ask        the places, each { at, in }: the question's location, such as
#              grouse/slack/chat/ask, and where it is posted there: a channel,
#              a thread or a chat
#   approvers  the scope a press needs to count
#   within     how long it waits, by default 7d; no press in time is no
#   asker      the email of the person who asked, shown, and whose own press is refused
#   request    what was asked, shown quoted
#   by         by a tool's or a toolkit's name, the ask, approvers or within
#              of its held calls, in place of the approval's own; tools of
#              one name in two toolkits share an entry
#
# The held calls of one tool or toolkit of `by` are asked about together, apart
# from the rest. Each question about them is given the ballot
# { at: ballot, key: <this run's ID>/<n> }, so the first answer that counts
# closes the others. That answer is the approval's for those calls; with none,
# the answer is no. A place whose question fails leaves the others asking.
flow: approval
description: Asks people in one or more places whether held jobs may run, and gives the jobs approved.
title: "Approve ${(Array.isArray(input.jobs) ? input.jobs : []).map((j) => j.name).join(', ')}"
input:
  asking: any
  jobs: any
  ask: "list?"
  approvers: "string?"
  within: "string?"
  asker: "string?"
  request: "string?"
  by: "map?"
allow: [send:ballot]
stages:
  brief:
    job: { script: ./approval.js, input: { do: brief, jobs: "${input.jobs}", asker: "${input.asker || ''}", request: "${input.request}", ask: "${input.ask}", approvers: "${input.approvers}", within: "${input.within}", by: "${input.by}", ballot: "${run.id}" } }
  question:
    each: "${stages.brief.output.places}"
    job:
      machine:
        flow: place
        input: { at: string, question: map }
        allow: ["send:${input.at}"]
        stages:
          asking: { job: { call: { at: "${input.at}" }, input: "${input.question}" } }
        output: ${stages.asking.output}
      input:
        at: "${item.at}"
        question:
          in: "${item.in}"
          text: "${(input.asking || {}).machine || 'A machine'} wants to run ${stages.brief.output.groups[item.group].names.join(', ')}.\n${stages.brief.output.groups[item.group].context}"
          choices: ["yes", "no"]
          approvers: "${stages.brief.output.groups[item.group].approvers}"
          asker: "${input.asker || ''}"
          within: "${stages.brief.output.groups[item.group].within}"
          ballot: { at: ballot, key: "${stages.brief.output.groups[item.group].ballot}" }
  # Ends each ballot once every question has ended.
  over:
    follows: [question]
    each: "${stages.brief.output.groups}"
    job: { send: { to: { at: ballot, key: "${item.ballot}" }, event: over } }
  # The first answer that counts in each group's places.
  answer:
    job: { script: ./approval.js, input: { do: answer, groups: "${stages.brief.output.groups}", asked: "${stages.question.output}" } }
output: ${stages.answer.output}
