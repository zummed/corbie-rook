# Telegram's listener, run as a child of a router: it asks for each new update.
# It sends its parent message for each direct message, stop for /stop, and
# answer for a tap on a question's button, which holds the question's key. The
# Bot API keeps no history a bot can read, so the listener keeps each chat's
# history in its output, and a new run of it starts with none. getUpdates never
# gives the bot's own messages, so a history holds the person's messages only.
#
# `receive: []` refuses a send from any location, which could otherwise
# address this run by its ID, so what it sends its parent came from Telegram.
statechart: telegram-listen
description: Sends its parent each Telegram message, button press and stop meant for the bot.
title: Telegram listener
receive: []
input: { type: object, additionalProperties: false }   # it takes no input, such as overhear
initial: hearing
states:
  hearing:
    job:
      script: ./telegram.js
      input:
        do: hear
        token: TELEGRAM_TOKEN
        cursor: "${states.hearing.output ? states.hearing.output.cursor : null}"
        failing: "${states.hearing.output ? states.hearing.output.failing : null}"
        chats: "${states.hearing.output ? states.hearing.output.chats : null}"
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      timeout: 2m
    on:
      message: { send: { to: parent, event: message, data: "${event.data}" } }
      stop: { send: { to: parent, event: stop, data: "${event.data}" } }
      answer: { send: { to: parent, event: answer, data: "${event.data}" } }
      done: hearing
      failed: resting
  resting:
    timers: { again: 1m }
    on: { again: hearing }
