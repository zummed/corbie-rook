# `in` is the chat. Telegram shows the file as a document named `name`.
flow: telegram-files-send
description: Sends a file in a Telegram chat under a name.
input: { in: string, name: string, file: blob }
stages:
  send:
    job:
      script: .rook/telegram/telegram.js
      input: { do: send, token: TELEGRAM_TOKEN, in: "${input.in}", name: "${input.name}", file: "${input.file}" }
      allow: ["secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      timeout: 5m
