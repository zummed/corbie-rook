# Rook's question on Telegram, which an approval calls, and any machine may.
# It is Slack's chat/ask with Telegram's script: it posts `text` in the chat
# `in` with a button for each of `choices`, and gives the first choice pressed
# by someone whose scopes, by `lookup`, hold `approvers` and whose email is not
# `asker`'s, as { choice, by }. Anyone else who presses is told why in an
# alert over the chat, and the buttons stay; when Telegram no longer takes an
# alert for the press, which it allows only for a short while, they are told
# in their own chat with the bot, if they have one. No press that counts
# within `within`, by default a week, is { choice: no }. A button holds this
# run's ID without its client's name, since Telegram keeps 64 bytes of it.
#
# With `ballot`, it speaks to the ballot of an approval asked in several places
# as Slack's chat/ask does, naming this place Telegram.
statechart: telegram-chat-ask
description: Asks a question on Telegram with a button for each choice, and gives the first choice pressed by someone whose scopes hold the approvers.
title: "${input.text.split('\\n')[0]}"
# The placed file fixes `router`, the router whose answers the question takes,
# and `lookup`, each with const: and default:, so no caller gives either. An
# answer from any other location is dropped.
input:
  type: object
  required: [in, text, choices, approvers, router, lookup]
  properties:
    in: { type: string }
    text: { type: string }
    choices: { type: array }
    approvers: { type: string }
    asker: { type: string }
    within: { type: string }
    router: { type: string }
    lookup: { type: string }
    ballot: { type: object }
initial: asking
states:
  asking:
    defer: [answer]
    job:
      script: .rook/telegram/telegram.js
      input: { do: ask, token: TELEGRAM_TOKEN, in: "${input.in}", text: "${input.text}", choices: "${input.choices}", question: "${run.id.slice(run.id.indexOf('/') + 1)}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      restart: { limit: 2 }
    on: { done: [{ go: opening, when: "${input.ballot != null}" }, open] }
  opening:
    defer: [answer]
    job: { send: { to: "${input.ballot}", event: opened }, allow: ["send:${input.ballot.at}"] }
    on: { done: open, failed: open }
  open:
    timers: { unanswered: "${input.within || '7d'}" }
    initial: waiting
    states:
      waiting:
        on: { answer: { go: checking, when: "${event.from.at === run.tree + '/' + input.router}" } }
      checking:
        defer: [answer]
        job:
          machine: .rook/shared/press.yaml
          input: { answer: "${event.data}", lookup: "${input.lookup}", approvers: "${input.approvers}", asker: "${input.asker || ''}", choices: "${input.choices}" }
        on:
          done:
            - { go: settling, when: "${event.data.counts && input.ballot != null}" }
            - { go: answered, when: "${event.data.counts}" }
            - { go: telling, when: "${event.data.tell !== ''}" }
            - waiting
          failed: waiting
      telling:
        defer: [answer]
        job:
          script: .rook/telegram/telegram.js
          input: { do: tell, token: TELEGRAM_TOKEN, sent: "${states.asking.output.sent}", answer: "${states.checking.output.answer}", text: "${states.checking.output.tell}" }
          allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
        on: { done: waiting, failed: waiting }
    on:
      unanswered: unanswered
      close: { go: closed, when: "${input.ballot != null && event.from.at === run.tree + '/' + input.ballot.at && event.from.key === input.ballot.key}" }
  settling:
    job: { send: { to: "${input.ballot}", event: settled, data: { choice: "${states.checking.output.choice}", by: "${states.checking.output.by}", where: Telegram } }, allow: ["send:${input.ballot.at}"] }
    on: { done: answered, failed: answered }
  answered:
    job:
      script: .rook/telegram/telegram.js
      input: { do: close, token: TELEGRAM_TOKEN, sent: "${states.asking.output.sent}", answer: "${states.checking.output.answer}", text: "${input.text + '\\n\\n' + states.checking.output.by + ' said ' + states.checking.output.choice + '.'}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      restart: { limit: 2 }
    on: { done: over, failed: over }
  over: { end: done, output: { choice: "${states.checking.output.choice}", by: "${states.checking.output.by}" } }
  # Keeps what the ballot's close gave, as this state's output.
  closed:
    initial: kept
    states:
      kept: { end: done, output: "${event.data}" }
    on: { done: answered_elsewhere }
  answered_elsewhere:
    job:
      script: .rook/telegram/telegram.js
      input: { do: close, token: TELEGRAM_TOKEN, sent: "${states.asking.output.sent}", text: "${input.text + '\\n\\n' + states.closed.output.by + ' said ' + states.closed.output.choice + ' on ' + states.closed.output.where + '.'}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      restart: { limit: 2 }
    on: { done: elsewhere, failed: elsewhere }
  elsewhere: { end: done, output: { choice: "${states.closed.output.choice}", by: "${states.closed.output.by}", elsewhere: true } }
  unanswered:
    job:
      script: .rook/telegram/telegram.js
      input: { do: close, token: TELEGRAM_TOKEN, sent: "${states.asking.output.sent}", text: "${input.text + '\\n\\nNo one answered in time, so the answer is no.'}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      restart: { limit: 2 }
    on: { done: expired, failed: expired }
  expired: { end: done, output: { choice: "no" } }
