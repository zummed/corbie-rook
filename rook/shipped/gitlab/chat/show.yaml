# GitLab's part of Rook's question, which only the question calls. ask writes
# `text` as a comment on the issue `in`, project#iid, that asks for a comment
# saying one of `choices`; tell writes a comment telling `by` `text`; close
# writes `said` in a comment.
flow: gitlab-chat-show
description: Asks a question in a comment on a GitLab issue, tells someone why their answer does not count, and closes the question.
input: { do: string, in: "string?", text: "string?", choices: "list?", question: "string?", sent: "any?", answer: "map?", by: "string?", said: "string?" }
stages:
  show:
    job:
      script: .rook/gitlab/gitlab.js
      files: [.rook/gitlab/api.js]
      input: "${Object.assign({ site: values.GITLAB_SITE }, input)}"
      allow: ["net:${values.GITLAB_SITE}", "secret:GITLAB_TOKEN@net:${values.GITLAB_SITE}"]
      restart: { limit: 2 }
output: ${stages.show.output}
