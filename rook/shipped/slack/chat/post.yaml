# `in` is a conversation, a channel's #name or a person's member ID, each with
# /thread for a thread. The text is Markdown, cut into the messages Slack
# takes, which are posted in order, each tried again on its own after a
# failure, so that none is posted twice.
flow: slack-chat-post
description: Posts a text on Slack, in Markdown, drawing its charts.
input: { in: string, text: string }
stages:
  cut:
    job:
      script: .rook/slack/slack.js
      files: [.rook/shared/rich.js]
      input: { do: cut, text: "${input.text}" }
  post:
    each: { items: "${stages.cut.output}", serial: true }
    job:
      script: .rook/slack/slack.js
      input: { do: post, in: "${input.in}", message: "${item}" }
      allow: ["secret:SLACK_TOKEN@net:slack.com"]
      restart: { limit: 2 }
