# `attachments` are a message's, as the listener sends them. Each is given with
# its contents as `file`, a blob; a larger one is given without them.
flow: slack-files-get
description: Downloads the files sent with a Slack message, each at most 32 MiB.
input: { attachments: list }
stages:
  download:
    job:
      script: .rook/slack/slack.js
      input: { do: download, attachments: "${input.attachments}", most: 33554432 }
      allow: ["secret:SLACK_TOKEN@net:files.slack.com"]
      timeout: 5m
