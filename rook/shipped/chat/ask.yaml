# Rook's question, the same on every service, which an approval calls, and any
# machine may. It calls the service's chat/show at `show` to post `text` in
# `in` with a choice for each of `choices`, and waits. A press counts when the
# presser's scopes, as the lookup at `lookup` gives them, hold `approvers`,
# and the presser's email is not `asker`. Anyone else who presses is told why,
# and the question stays. The first press that counts closes the question and
# ends it with { choice, by }, `by` being the presser's name. With no press
# that counts within `within`, by default a week, it ends with { choice: no }.
# The question holds this run's ID, and the router sends a press to it.
#
# With `ballot`, the address { at, key } of the ballot of an approval asked in
# several places, it sends the ballot opened once it has posted, and settled,
# { choice, by, where }, when a press counts. On close from the ballot, with
# the same data, it shows "<by> said <choice> on <where>." and ends with
# { choice, by, elsewhere: true }.
#
# chat/show does three things: ask posts the question and gives `sent` and
# `where`, the service's name; tell tells a presser `text`, given the press
# and `sent`; and close shows `said`, given `sent`, the question's `text` and,
# after a press that counts, that press.
statechart: chat-ask
description: Asks a question with a choice for each answer, and gives the first choice of someone whose scopes hold the approvers.
title: "${input.text.split('\\n')[0]}"
# The placed file fixes `router`, the router whose answers the question takes,
# `lookup`, and `show`, each with const: and default:, so no caller gives
# them. An answer from any other location is dropped, and so is one that names
# a chat other than the question's, as an answer on Jira does.
input:
  type: object
  required: [in, text, choices, approvers, router, lookup, show]
  properties:
    in: { type: string }
    text: { type: string }
    choices: { type: array }
    approvers: { type: string }
    asker: { type: string }
    within: { type: string }
    router: { type: string }
    lookup: { type: string }
    show: { type: string }
    ballot: { type: object }
allow: ["send:${input.show}"]
initial: asking
states:
  asking:
    defer: [answer]
    job: { call: { at: "${input.show}" }, input: { do: ask, in: "${input.in}", text: "${input.text}", choices: "${input.choices}", question: "${run.id}" } }
    on: { done: [{ go: opening, when: "${input.ballot != null}" }, open] }
  opening:
    defer: [answer]
    job: { send: { to: "${input.ballot}", event: opened }, allow: ["send:${input.ballot.at}"] }
    on: { done: open, failed: open }
  open:
    timers: { unanswered: "${input.within || '7d'}" }
    initial: waiting
    states:
      waiting:
        on: { answer: { go: checking, when: "${event.from.at === run.tree + '/' + input.router && (event.data.chat === undefined || event.data.chat === states.asking.output.sent.in)}" } }
      checking:
        defer: [answer]
        job:
          machine: .rook/shared/press.yaml
          input: { answer: "${event.data}", lookup: "${input.lookup}", approvers: "${input.approvers}", asker: "${input.asker || ''}", choices: "${input.choices}" }
        on:
          done:
            - { go: settling, when: "${event.data.counts && input.ballot != null}" }
            - { go: answered, when: "${event.data.counts}" }
            - { go: telling, when: "${event.data.tell !== ''}" }
            - waiting
          failed: waiting
      telling:
        defer: [answer]
        job: { call: { at: "${input.show}" }, input: { do: tell, sent: "${states.asking.output.sent}", answer: "${states.checking.output.answer}", by: "${states.checking.output.by}", text: "${states.checking.output.tell}" } }
        on: { done: waiting, failed: waiting }
    on:
      unanswered: unanswered
      close: { go: closed, when: "${input.ballot != null && event.from.at === run.tree + '/' + input.ballot.at && event.from.key === input.ballot.key}" }
  settling:
    job: { send: { to: "${input.ballot}", event: settled, data: { choice: "${states.checking.output.choice}", by: "${states.checking.output.by}", where: "${states.asking.output.where}" } }, allow: ["send:${input.ballot.at}"] }
    on: { done: answered, failed: answered }
  answered:
    job: { call: { at: "${input.show}" }, input: { do: close, sent: "${states.asking.output.sent}", answer: "${states.checking.output.answer}", text: "${input.text}", said: "${states.checking.output.by + ' said ' + states.checking.output.choice + '.'}" } }
    on: { done: over, failed: over }
  over: { end: done, output: { choice: "${states.checking.output.choice}", by: "${states.checking.output.by}" } }
  # Keeps what the ballot's close gave, as this state's output.
  closed:
    initial: kept
    states:
      kept: { end: done, output: "${event.data}" }
    on: { done: answered_elsewhere }
  answered_elsewhere:
    job: { call: { at: "${input.show}" }, input: { do: close, sent: "${states.asking.output.sent}", text: "${input.text}", said: "${states.closed.output.by + ' said ' + states.closed.output.choice + ' on ' + states.closed.output.where + '.'}" } }
    on: { done: elsewhere, failed: elsewhere }
  elsewhere: { end: done, output: { choice: "${states.closed.output.choice}", by: "${states.closed.output.by}", elsewhere: true } }
  unanswered:
    job: { call: { at: "${input.show}" }, input: { do: close, sent: "${states.asking.output.sent}", text: "${input.text}", said: "No one answered in time, so the answer is no." } }
    on: { done: expired, failed: expired }
  expired: { end: done, output: { choice: "no" } }
