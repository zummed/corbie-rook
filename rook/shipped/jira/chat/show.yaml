# Jira's part of Rook's question, which only the question calls. ask writes
# `text` as a comment on the issue `in`, its key in any case or its ID, with a
# line for each of `choices` that holds the choice and the question's run ID;
# tell writes a comment that names who answered and tells them `text`; close
# writes `said` in a comment.
flow: jira-chat-show
description: Asks a question in a comment on a Jira issue, tells someone why their answer does not count, and closes the question.
input: { do: string, in: "string?", text: "string?", choices: "list?", question: "string?", sent: "any?", answer: "map?", by: "string?", said: "string?" }
stages:
  show:
    job:
      script: .rook/jira/jira.js
      files: [.rook/jira/api.js, .rook/shared/rich.js]
      input: "${Object.assign({ site: values.JIRA_SITE, email: values.JIRA_EMAIL }, input)}"
      allow: ["secret:JIRA_TOKEN@net:${values.JIRA_SITE}"]
      restart: { limit: 2 }
