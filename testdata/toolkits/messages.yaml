# The messages toolkit: a text to someone's Telegram chat, which waits for a yes
# from someone who holds messages:approve and did not ask for it.
description: Messages to people on Telegram.
instructions: Write to a person only when the asker asks you to.
ask:
  machine: .rook/approval.yaml
  input:
    ask: [{ at: gromit/telegram/chat/ask, in: "1" }]
    approvers: messages:approve
    asker: "${input.asker.email}"
    request: "${input.messages.map((m) => (m.later != null ? '(a reminder the bot set) ' : '') + m.text).join('\\n')}"
tools:
  tell:
    description: Write a text in a person's Telegram chat, by the chat's ID.
    args: { chat: string, text: string }
    job:
      call: { at: gromit/telegram/chat/post }
      input: { in: "${args.chat}", text: "${args.text}" }
      allow: [send:gromit/telegram/chat/post]
      approve: true
