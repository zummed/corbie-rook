# The orders app. read_file is offered with the toolkit; change_file only to a
# person whose scopes hold orders:write, and it waits for a yes in
# #orders-team from someone with orders:approve who did not ask.
description: The orders app. How it is deployed, its settings, and changing them.
instructions: { include: ./orders.md }
ask:
  machine: .rook/approval.yaml
  input: { ask: gromit/slack/chat/ask, approvers: "orders:approve", in: "#orders-team", within: 1d, asker: "${input.asker.email}", request: "${input.messages.map((m) => m.text).join('\\n')}" }
tools:
  read_file: { call: gromit/gitlab/repository/files/read, input: { project: group/orders } }
  change_file:
    call: gromit/gitlab/repository/commits/create
    input: { project: group/orders }
    approve: true
    when: "${input.asker.scopes.includes('orders:write')}"
