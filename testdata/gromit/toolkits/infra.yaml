# The servers. restart waits for a yes in #infra from someone with
# infra:approve who did not ask, for an hour; no press in time is no.
description: The servers. Their state, and restarting one.
instructions: { include: ./infra.md }
ask:
  machine: .rook/approval.yaml
  input: { ask: gromit/slack/chat/ask, approvers: "infra:approve", in: "#infra", within: 1h, asker: "${input.asker.email}", request: "${input.messages.map((m) => m.text).join('\\n')}" }
tools:
  vm_status: { call: infra/vms/status }
  restart: { call: infra/vms/restart, approve: true }
