# The Jira issues bridge runs while this file is here. To stop it, delete the
# file and run corbie run submit . in the project. The host is the value
# JIRA_SITE, and the account its token belongs to the value JIRA_EMAIL: corbie
# controller value set JIRA_SITE example.atlassian.net --at /<project>. A
# changed value is read when the bridge starts again: corbie run cancel
# /<project>/bridges/jira, then corbie run submit . Set the projects the bot
# watches.
# Add to its input `settle: 2m` to hear an opened issue once nobody has changed
# it for two minutes, as it is then, and `overhear: true` to hear every issue and
# comment, each weighed by attend.yaml, which a project with overhear writes.
flow: jira-bridge
title: Jira bridge
lifetime: singleton
stages:
  listen:
    job:
      machine: { statechart: jira-listen, include: .rook/bridges/jira/listen.yaml }
      restart: { when: always }
      input: { projects: [OPS] }
