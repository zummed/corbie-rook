# The GitLab issues bridge runs while this file is here. To stop it, delete the
# file and run corbie run submit bridges. Set your GitLab's host and the
# projects the bot watches.
# Add to its input `settle: 2m` to hear an opened issue once nobody has changed
# it for two minutes, as it is then, and `overhear: true` to hear every issue and
# comment, each weighed by attend.yaml.
flow: gitlab-bridge
title: GitLab bridge
limits: { depth: 16 }   # every conversation counts its levels from here
stages:
  listen:
    job:
      machine: .rook/bridges/gitlab/listen.yaml
      restart: { when: always }
      input: { dir: "${run.context}", site: gitlab.example.com, projects: [group/project] }
