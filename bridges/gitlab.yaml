# The GitLab issues bridge runs while this file is here. To stop it, delete the
# file and run corbie run submit . in the project. The host is the value
# GITLAB_SITE: corbie controller value set GITLAB_SITE gitlab.example.com --at
# /<project>. A changed value is read when the bridge starts again: corbie run
# cancel /<project>/bridges/gitlab, then corbie run submit . Set the projects
# the bot watches.
# Add to its input `settle: 2m` to hear an opened issue once nobody has changed
# it for two minutes, as it is then, and `overhear: true` to hear every issue and
# comment, each weighed by attend.yaml, which a project with overhear writes.
flow: gitlab-bridge
title: GitLab bridge
lifetime: singleton
stages:
  listen:
    job:
      machine: { statechart: gitlab-listen, include: .rook/bridges/gitlab/listen.yaml }
      restart: { when: always }
      input: { projects: [group/project] }
