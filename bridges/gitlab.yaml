# The GitLab issues bridge runs while this file is here. Delete it to stop the
# bridge. Set your GitLab's host and the projects the bot watches.
flow: gitlab-bridge
limits: { depth: 16 }   # every conversation counts its levels from here
stages:
  listen:
    job:
      machine: .rook/bridges/gitlab/listen.yaml
      restart: { when: always }
      input: { dir: "${run.context}", site: gitlab.example.com, projects: [group/project] }
