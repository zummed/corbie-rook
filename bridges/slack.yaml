# The slack bridge runs while this file is here. To stop it, delete
# the file and run corbie run submit bridges.
# Add `overhear: true` to its input to hear replies in a thread the bot has said
# something in, each weighed by attend.yaml.
flow: slack-bridge
title: Slack bridge
limits: { depth: 16 }   # every conversation counts its levels from here
stages:
  listen:
    job:
      machine: .rook/bridges/slack/listen.yaml
      restart: { when: always }
      input: { dir: "${run.context}" }
