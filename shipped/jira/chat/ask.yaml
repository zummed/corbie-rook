# Rook's question on Jira, which an approval calls, and any machine may. It is
# Slack's chat/ask with Jira's script: it writes `text` as a comment on the
# issue `in`, such as OPS-12, with a line for each of `choices` that holds the
# choice and this run's ID. The listener sends a comment that holds only such
# a line to its router as an answer, and the router sends it here. An answer
# written on any issue but `in` is dropped, and its choice is matched to one
# of `choices` in any case, as on GitLab. An answer counts when the person's
# scopes, by the lookup at `lookup`, hold `approvers`, and the person's email
# is not `asker`'s; anyone else is told why in a comment that names them, and
# the question waits on. A choice that is none of
# `choices` is told nothing. The first answer that counts closes the question
# with a comment, and the run ends with { choice, by }. No answer that counts
# within `within`, by default a week, closes it and ends with { choice: no }.
statechart: jira-chat-ask
description: Asks a question in a comment on a Jira issue, and gives the first choice answered by someone whose scopes hold the approvers.
title: "${input.in}: ${input.text.split('\\n')[0]}"
# The placed file fixes `router`, the router whose answers the question takes,
# and `lookup`, each with const: and default:, so no caller gives either. An
# answer from any other location is dropped.
input:
  type: object
  required: [in, text, choices, approvers, router, lookup]
  properties:
    in: { type: string }
    text: { type: string }
    choices: { type: array }
    approvers: { type: string }
    asker: { type: string }
    within: { type: string }
    router: { type: string }
    lookup: { type: string }
initial: asking
states:
  asking:
    defer: [answer]
    job:
      script: .rook/jira/jira.js
      files: [.rook/jira/api.js, .rook/shared/rich.js]
      input: { do: ask, in: "${input.in}", text: "${input.text}", choices: "${input.choices}", question: "${run.id.slice(run.id.indexOf('/') + 1)}", site: "${values.JIRA_SITE}", email: "${values.JIRA_EMAIL}" }
      allow: ["net:${values.JIRA_SITE}", "secret:JIRA_TOKEN@net:${values.JIRA_SITE}"]
      restart: { limit: 2 }
    on: { done: open }
  open:
    timers: { unanswered: "${input.within || '7d'}" }
    initial: waiting
    states:
      waiting:
        on: { answer: { go: checking, when: "${event.from.at === run.tree + '/' + input.router && event.data.chat === input.in}" } }
      checking:
        defer: [answer]
        job:
          machine: .rook/shared/press.yaml
          input: { answer: "${Object.assign({}, event.data, { choice: input.choices.find((c) => String(c).toLowerCase() === String(event.data.choice).toLowerCase()) ?? event.data.choice })}", lookup: "${input.lookup}", approvers: "${input.approvers}", asker: "${input.asker || ''}", choices: "${input.choices}" }
        on:
          done:
            - { go: answered, when: "${event.data.counts}" }
            - { go: telling, when: "${event.data.tell !== ''}" }
            - waiting
          failed: waiting
      telling:
        defer: [answer]
        job:
          script: .rook/jira/jira.js
          files: [.rook/jira/api.js, .rook/shared/rich.js]
          input: { do: tell, sent: "${states.asking.output.sent}", answer: "${states.checking.output.answer}", text: "${states.checking.output.tell}", site: "${values.JIRA_SITE}", email: "${values.JIRA_EMAIL}" }
          allow: ["net:${values.JIRA_SITE}", "secret:JIRA_TOKEN@net:${values.JIRA_SITE}"]
        on: { done: waiting, failed: waiting }
    on: { unanswered: unanswered }
  answered:
    job:
      script: .rook/jira/jira.js
      files: [.rook/jira/api.js, .rook/shared/rich.js]
      input: { do: close, sent: "${states.asking.output.sent}", answer: "${states.checking.output.answer}", text: "${states.checking.output.by + ' answered ' + states.checking.output.choice + '.'}", site: "${values.JIRA_SITE}", email: "${values.JIRA_EMAIL}" }
      allow: ["net:${values.JIRA_SITE}", "secret:JIRA_TOKEN@net:${values.JIRA_SITE}"]
      restart: { limit: 2 }
    on: { done: over, failed: over }
  over: { end: done, output: { choice: "${states.checking.output.choice}", by: "${states.checking.output.by}" } }
  unanswered:
    job:
      script: .rook/jira/jira.js
      files: [.rook/jira/api.js, .rook/shared/rich.js]
      input: { do: close, sent: "${states.asking.output.sent}", text: "No one answered in time, so the answer is no.", site: "${values.JIRA_SITE}", email: "${values.JIRA_EMAIL}" }
      allow: ["net:${values.JIRA_SITE}", "secret:JIRA_TOKEN@net:${values.JIRA_SITE}"]
      restart: { limit: 2 }
    on: { done: expired, failed: expired }
  expired: { end: done, output: { choice: "no" } }
