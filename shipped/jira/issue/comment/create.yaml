# `to` is the issue's key, such as OPS-12.
flow: jira-issue-comment-create
description: Writes a comment on a Jira issue, each chart as its table.
input: { to: string, text: string }
stages:
  say:
    job:
      script: .rook/jira/jira.js
      files: [.rook/jira/api.js, .rook/shared/rich.js]
      input: { do: say, to: "${input.to}", text: "${input.text}", site: "${values.JIRA_SITE}", email: "${values.JIRA_EMAIL}" }
      allow: ["net:${values.JIRA_SITE}", "secret:JIRA_TOKEN@net:${values.JIRA_SITE}"]
      restart: { limit: 2 }
output: ${stages.say.output}
