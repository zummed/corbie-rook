# `issue` is the issue's key, such as OPS-12. It gives `text`, the issue and
# its public comments, the latest last, as much as a model needs; `attachments`,
# the files they name, without their contents; and `complete`, true when every
# comment was read.
flow: jira-issue-comment-list
description: Reads a Jira issue and its public comments.
input: { issue: string }
stages:
  read:
    job:
      script: .rook/jira/jira.js
      files: [.rook/jira/api.js, .rook/shared/thread.js]
      input: { do: history, issue: "${input.issue}", site: "${values.JIRA_SITE}", email: "${values.JIRA_EMAIL}" }
      allow: ["net:${values.JIRA_SITE}", "secret:JIRA_TOKEN@net:${values.JIRA_SITE}"]
      timeout: 20s
output: ${stages.read.output}
