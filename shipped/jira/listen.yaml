# Jira's listener, run as a child of a router: it asks each project what
# changed, every thirty seconds. It signs in at the value JIRA_SITE as the
# value JIRA_EMAIL, with the API token that is the secret JIRA_TOKEN. Its
# first ask marks the time, and hears nothing. It sends its parent:
#
#   message   an opened issue or a comment that names the bot; with overhear,
#             every other one, marked unaddressed
#   answer    a comment that holds only a line a question showed: a choice and
#             the question's run ID
#
# A message holds the person's name and email, as Jira gives them, and the
# issue before it as history, a blob of { line, attachments } entries, oldest
# first: the issue itself and the public comments before it, of the latest 50.
# complete is true when those were every comment. An opened issue is sent once
# nobody has changed it for settle.
#
# `receive: []` refuses a send from any location, which could otherwise
# address this run by its ID, so what it sends its parent came from Jira.
statechart: jira-listen
description: Sends its parent each Jira issue and comment meant for the bot, and each answer to a question.
title: Jira listener
receive: []
input:
  projects: list
  overhear: "boolean?"
  settle: "string?"
initial: hearing
states:
  hearing:
    job:
      script: ./jira.js
      files: [./api.js]
      input: { do: hear, site: "${values.JIRA_SITE}", email: "${values.JIRA_EMAIL}", projects: "${input.projects}", overhear: "${input.overhear || false}", settle: "${input.settle || '0s'}", cursor: "${states.hearing.output ? states.hearing.output.cursor : null}" }
      allow: ["net:${values.JIRA_SITE}", "secret:JIRA_TOKEN@net:${values.JIRA_SITE}"]
      timeout: 2m
    on:
      message: { send: { to: parent, event: message, data: "${event.data}" } }
      answer: { send: { to: parent, event: answer, data: "${event.data}" } }
      done: resting
      failed: resting
  resting:
    timers: { again: 30s }
    on: { again: hearing }
