# Rook's approval, which a toolkit or a machine names as its ask. It calls the
# question at `ask`, a bot's placed chat/ask, with yes and no, naming the
# machine that asks, each held job and what was asked. Corbie gives it
# `asking` and `jobs`; the ask's input gives the rest:
#
#   ask        the location of the question, such as gromit/slack/chat/ask
#   lookup     the location of the lookup, such as people/find
#   approvers  the scope a press needs to count
#   in         where the question is posted: a channel, a thread or a chat
#   within     how long it waits, by default 7d; no press in time is no
#   asker      the email of the person who asked, whose own press is refused
#   request    what was asked, shown quoted
flow: approval
description: Asks people whether held jobs may run, and gives the jobs approved.
title: "Approve ${(Array.isArray(input.jobs) ? input.jobs : []).map((j) => j.name).join(', ')}"
input:
  asking: any
  jobs: any
  ask: string
  lookup: string
  approvers: string
  in: string
  within: "string?"
  asker: "string?"
  request: "string?"
allow: ["send:${input.ask}"]
stages:
  brief:
    job: { script: ./approval.js, input: { jobs: "${input.jobs}", request: "${input.request}" } }
  question:
    job:
      call: { at: "${input.ask}" }
      input:
        in: "${input.in}"
        text: "${(input.asking || {}).machine || 'A machine'} wants to run ${stages.brief.output.names.join(', ')}.\n\n${stages.brief.output.context}"
        choices: ["yes", "no"]
        lookup: "${input.lookup}"
        approvers: "${input.approvers}"
        asker: "${input.asker || ''}"
        within: "${input.within || '7d'}"
output: >-
  ${{ approved: stages.question.output.choice === 'yes' ? stages.brief.output.names : [],
      note: stages.question.output.by ? stages.question.output.by + ' said ' + stages.question.output.choice + '.' : 'No one answered in time, so the answer is no.' }}
