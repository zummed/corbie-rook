# Asks people, with a button for each choice, and gives `choice`: the first answer
# from someone `people` names, or no after seven days. `people` names people and
# groups in lookup.yaml, each asked on their own bridge; with `in`, a Slack channel
# named as rules.yaml names places, the question is posted there instead.
flow: ask
input: { people: list, in: "string?", text: string, choices: list }
stages:
  question:
    job:
      machine: ./question.yaml
      key: "question:${run.id.slice(-10)}"
      input: { people: "${input.people}", in: "${input.in || ''}", text: "${input.text}", choices: "${input.choices}" }
output: ${stages.question.output}
