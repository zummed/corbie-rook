# Says a text to a person, on the first bridge in their people.yaml entry that
# the project runs, as lookup.yaml says.
flow: tell
input: { person: string, text: string }
allow: [send:lookup]
stages:
  reach:
    job: { call: { at: lookup }, input: { do: reach, names: ["${input.person}"] } }
  say:
    job: { machine: ./direct.yaml, input: { person: "${input.person}", ways: "${stages.reach.output[0].ways}", call: say, input: { text: "${input.text}" } } }
