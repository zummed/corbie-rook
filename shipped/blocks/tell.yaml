# Says a text to a person, wherever lookup.yaml says they are reached.
flow: tell
input: { person: string, text: string }
allow: [send:lookup]
stages:
  reach:
    job: { call: { at: lookup }, input: { do: reach, names: ["${input.person}"] } }
  say:
    job: { machine: ./say.yaml, input: { address: "${stages.reach.output[0]}", text: "${input.text}" } }
