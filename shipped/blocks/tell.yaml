# Says a text to a person, on the first of their ways that lookup.yaml gives.
flow: tell
input: { person: string, text: string }
allow: [send:lookup, "send:.rook/bridges/*/say"]
stages:
  reach:
    job: { call: { at: lookup }, input: { do: reach, names: ["${input.person}"] } }
  say:
    job:
      call: { at: ".rook/bridges/${stages.reach.output[0].ways[0].bridge}/say" }
      input: { to: "${stages.reach.output[0].ways[0].id}", text: "${input.text}" }
