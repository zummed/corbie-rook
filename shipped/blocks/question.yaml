# The run behind a question, under the key ask.yaml gives it, which the buttons
# name, so a tap goes to it. It asks each person `people` names on their own
# bridge, or posts in `in`, a Slack channel or conversation. The first tap from
# someone `people` names, as lookup.yaml says who they are, is the answer, with
# the values of `fields`, which only Slack shows; no after `within`, by default
# seven days. Each
# message it posted then shows the answer, and its buttons go.
statechart: question
title: "${input.text.split('\\n')[0]}"
input: { people: list, in: "string?", text: string, choices: list, fields: "list?", within: "string?" }
initial: asking
states:
  asking:
    defer: [answer]
    job:
      input: { people: "${input.people}", in: "${input.in || ''}", text: "${input.text}", choices: "${input.choices}", fields: "${input.fields || []}", question: "${run.key.slice(9)}" }
      machine:
        flow: ask-on
        input: { people: list, in: string, text: string, choices: list, fields: list, question: string }
        stages:
          reach:
            job: { machine: lookup.yaml, input: { do: reach, names: "${input.in ? [] : input.people}" } }
          telegram:
            when: "${!input.in && !input.fields.length && stages.reach.output.some((t) => t.bridge === 'telegram')}"
            job:
              machine: .rook/bridges/telegram/ask.yaml
              input: { to: "${stages.reach.output.filter((t) => t.bridge === 'telegram').map((t) => t.id)}", text: "${input.text}", choices: "${input.choices}", question: "${input.question}" }
          slack:
            when: "${!!input.in || stages.reach.output.some((t) => t.bridge === 'slack')}"
            job:
              machine: .rook/bridges/slack/ask.yaml
              input: { to: "${stages.reach.output.filter((t) => t.bridge === 'slack').map((t) => t.id)}", in: "${input.in}", text: "${input.text}", choices: "${input.choices}", fields: "${input.fields}", question: "${input.question}" }
        output: "${ { telegram: stages.telegram.skipped ? [] : (stages.telegram.output || {}).sent || [], slack: stages.slack.skipped ? [] : (stages.slack.output || {}).sent || [] } }"
    on: { done: open }
  open:
    timers: { unanswered: "${input.within || '7d'}" }
    initial: waiting
    states:
      waiting:
        on: { answer: checking }
      checking:
        defer: [answer]
        job:
          input: { bridge: "${event.data.bridge}", from: "${event.data.from}", choice: "${event.data.choice}", values: "${event.data.values || {}}", people: "${input.people}" }
          machine:
            flow: tap
            input: { bridge: string, from: string, choice: string, values: map, people: list }
            stages:
              who:
                job: { machine: lookup.yaml, input: { do: who, bridge: "${input.bridge}", id: "${input.from}" } }
            output: "${ { counts: [stages.who.output.person, ...stages.who.output.groups].some((n) => input.people.includes(n)), person: stages.who.output.person, choice: input.choice, values: input.values } }"
        on:
          done:
            - { go: answered, when: "${event.data.counts}" }
            - waiting
          failed: waiting
    on: { unanswered: unanswered }
  answered:
    job: { machine: ./close.yaml, input: { sent: "${states.asking.output}", text: "${input.text + '\\n\\n' + states.checking.output.person + ' said ' + states.checking.output.choice + '.' + (input.fields || []).map((f) => '\\n' + (f.label || f.name) + ': ' + (states.checking.output.values[f.name] ?? '')).join('')}" } }
    on: { done: over, failed: over }
  over: { end: done, output: { choice: "${states.checking.output.choice}", values: "${states.checking.output.values}" } }
  unanswered:
    job: { machine: ./close.yaml, input: { sent: "${states.asking.output}", text: "${input.text + '\\n\\nNo one answered in time, so the answer is no.'}" } }
    on: { done: expired, failed: expired }
  expired: { end: done, output: { choice: "no" } }
