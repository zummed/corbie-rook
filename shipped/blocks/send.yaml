# Sends a file at an address, as say.yaml says a text: `file` is a blob, or else
# `text` is sent as a file, of the type its name gives. It gives what the bridge
# sent. It calls the bridge's send at .rook/bridges/<bridge>/send.
flow: send
input: { address: map, name: string, file: "any?", text: "any?" }
allow: ["send:.rook/bridges/*/send"]
stages:
  file:
    job: { script: ./file.js, files: [./types.js], input: { name: "${input.name}", file: "${input.file}", text: "${input.text}" } }
  send:
    job: { call: { at: ".rook/bridges/${input.address.bridge}/send" }, input: { to: "${input.address.id}", name: "${input.name}", file: "${stages.file.output}" } }
output: ${stages.send.output}
