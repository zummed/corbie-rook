# Shows what the bot is doing at an address, where a bridge has a way to: a
# thread on Slack, and "typing" on Telegram. An empty text clears it. A status is
# only a courtesy, so one that fails gives nothing and stops nothing.
flow: status
input: { address: map, text: string }
stages:
  slack:
    when: "${input.address.bridge === 'slack'}"
    job: { machine: .rook/bridges/slack/status.yaml, input: { to: "${input.address.id}", text: "${input.text}" } }
  telegram:
    when: "${input.address.bridge === 'telegram'}"
    job: { machine: .rook/bridges/telegram/status.yaml, input: { to: "${input.address.id}", text: "${input.text}" } }
output: "${ { shown: !stages.slack.skipped && !stages.slack.failed || !stages.telegram.skipped && !stages.telegram.failed } }"
