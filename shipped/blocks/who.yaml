# Who a message is from, and which agent they get in the place it came from:
# lookup.yaml says who they are, and rules.yaml what they get. `rule` is the
# entry of rules.yaml that chose the agent.
flow: who
input: { bridge: string, id: string, place: string }
allow: [send:lookup]
stages:
  person:
    job: { call: { at: lookup }, input: { do: who, bridge: "${input.bridge}", id: "${input.id}" } }
  agent:
    job:
      script: ./who.js
      files: [rules.yaml]
      input: { person: "${stages.person.output.person}", groups: "${stages.person.output.groups}", place: "${input.place}" }
output: "${ { person: stages.person.output.person, groups: stages.person.output.groups, agent: stages.agent.output ? stages.agent.output.name : null, rule: stages.agent.output } }"
