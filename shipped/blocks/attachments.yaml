# Files of a message or its thread, downloaded from the bridge they came from:
# a message's own files, and a file the tool look asks for. Each is given as it
# came, with file, a blob of its contents. A file over `most` bytes is given
# without file: 32 MiB, and 20 MB on Telegram, which gives a bot no more. When
# the download fails, each file is given as it came. With no files it gives
# null. One stage for each bridge, since a job's machine is named here.
flow: attachments
input: { address: map, attachments: "any?" }
stages:
  telegram:
    when: "${!!(input.attachments || []).length && input.address.bridge === 'telegram'}"
    job: { machine: .rook/bridges/telegram/attachments.yaml, input: { attachments: "${input.attachments}", most: 20000000 } }
  slack:
    when: "${!!(input.attachments || []).length && input.address.bridge === 'slack'}"
    job: { machine: .rook/bridges/slack/attachments.yaml, input: { attachments: "${input.attachments}", most: 33554432 } }
  gitlab:
    when: "${!!(input.attachments || []).length && input.address.bridge === 'gitlab'}"
    job: { machine: .rook/bridges/gitlab/attachments.yaml, input: { attachments: "${input.attachments}", most: 33554432, site: "${input.address.settings.site}" } }
  jira:
    when: "${!!(input.attachments || []).length && input.address.bridge === 'jira'}"
    job: { machine: .rook/bridges/jira/attachments.yaml, input: { attachments: "${input.attachments}", most: 33554432, site: "${input.address.settings.site}", email: "${input.address.settings.email}" } }
output: "${stages.telegram.failed || stages.slack.failed || stages.gitlab.failed || stages.jira.failed ? input.attachments : !stages.telegram.skipped ? stages.telegram.output : !stages.slack.skipped ? stages.slack.output : !stages.gitlab.skipped ? stages.gitlab.output : !stages.jira.skipped ? stages.jira.output : null}"
