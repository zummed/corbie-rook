# Files of a message or its thread, downloaded from the bridge they came from:
# a message's own files, and a file the tool look asks for. Each is given as it
# came, with file, a blob of its contents. Each bridge's attachments says how
# large a file it downloads, and gives a larger one without file. When the
# download fails, each file is given as it came. With no files it gives null. It
# calls the bridge's attachments at .rook/bridges/<bridge>/attachments.
flow: attachments
input: { address: map, attachments: "any?" }
allow: ["send:.rook/bridges/*/attachments"]
stages:
  download:
    when: "${!!(input.attachments || []).length}"
    job: { call: { at: ".rook/bridges/${input.address.bridge}/attachments" }, input: { attachments: "${input.attachments}" } }
output: "${stages.download.failed ? input.attachments : stages.download.skipped ? null : stages.download.output}"
