# Approval for a part's held calls, which a part names as its ask. Its input
# says who approves:
#   people   people and groups in lookup.yaml, each asked on their own bridge;
#            with none, or no people at all, no one is asked
#   in       a Slack channel's #name to ask them in, in place of each one alone
#   review   true to call review.yaml first; by default no review
#   alone    tools whose calls the review's yes approves with no person asked
#   request  what was asked, the agent's input request, which everyone is shown
# A review's refuse ends it, and anything else goes to the people, shown the
# review's word. A review that fails is taken as refer, and the people are
# shown its error.
flow: approval
title: "Approve ${(Array.isArray(input.jobs) ? input.jobs : []).map((j) => j.name).join(', ')}${input.request ? ': ' + input.request.split('\\n').pop() : ''}"
input: { asking: any, jobs: any, part: string, people: "list?", in: "string?", review: "boolean?", alone: "list?", request: "string?" }
allow: [send:review, send:.rook/blocks/ask]
stages:
  brief:
    job: { script: ./held.js, input: { jobs: "${input.jobs}", alone: "${input.review ? input.alone : []}", request: "${input.request}" } }
  review:
    when: "${!!input.review}"
    job: { call: { at: review }, input: { context: "${stages.brief.output.context + '\\n\\n' + stages.brief.output.rule}" } }
  person:
    when: "${(input.people || []).length > 0 && (stages.review.skipped || stages.review.failed || !(stages.review.output.reply.says === 'refuse' || stages.review.output.reply.says === 'yes' && stages.brief.output.alone))}"
    job:
      call: { at: .rook/blocks/ask }
      input:
        people: "${input.people}"
        in: "${input.in || ''}"
        choices: ["yes", "no"]
        text: "An agent wants to run ${stages.brief.output.names.join(', ')}.\n\n${stages.brief.output.context}${stages.review.skipped ? '' : stages.review.failed ? '\\n\\nReview failed: ' + stages.review.error : '\\n\\nReview: ' + stages.review.output.reply.says + ', ' + stages.review.output.reply.note}"
output: >-
  ${!stages.person.skipped ? { approve: stages.person.output.choice === 'yes' ? stages.brief.output.names : [], note: 'The approver said ' + stages.person.output.choice + '.' }
  : !stages.review.skipped && !stages.review.failed && (stages.review.output.reply.says === 'refuse' || stages.review.output.reply.says === 'yes' && stages.brief.output.alone)
  ? { approve: stages.review.output.reply.says === 'yes' ? stages.brief.output.names : [], note: 'The review said ' + stages.review.output.reply.says + ': ' + stages.review.output.reply.note }
  : { approve: [], note: 'The part ' + input.part + ' names no one in people to approve its calls.' }}
