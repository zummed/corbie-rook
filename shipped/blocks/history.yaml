# What was said before a message in the thread or on the issue an address names,
# for a bridge whose service keeps it: { text, attachments } as thread.js gives
# it, or nothing. It is only context, so a failure gives nothing and the message
# is still answered. Telegram keeps nothing a bot can read. It calls the bridge's
# history at .rook/bridges/<bridge>/history.
flow: history
input: { address: map, wanted: boolean }
allow: ["send:.rook/bridges/*/history"]
stages:
  read:
    when: "${input.wanted && ['slack', 'gitlab', 'jira'].includes(input.address.bridge)}"
    job: { call: { at: ".rook/bridges/${input.address.bridge}/history" }, input: { to: "${input.address.id}", at: "${input.address.at}" } }
output: "${stages.read.failed || stages.read.skipped ? null : stages.read.output}"
