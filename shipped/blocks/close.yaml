# Shows the answer on each message a question posted, and takes its buttons away.
# `sent` is what the bridges' asks gave, by bridge. It calls each bridge's close
# at .rook/bridges/<bridge>/close.
flow: close
input: { sent: map, text: string }
allow: ["send:.rook/bridges/*/close"]
stages:
  close:
    each: "${Object.keys(input.sent).filter((bridge) => (input.sent[bridge] || []).length > 0)}"
    job: { call: { at: ".rook/bridges/${item}/close" }, input: { sent: "${input.sent[item]}", text: "${input.text}" } }
