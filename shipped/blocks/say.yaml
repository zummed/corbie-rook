# Says a text at an address: { bridge, id }, with `answers` where a bridge uses
# it. It calls the bridge's say at .rook/bridges/<bridge>/say.
flow: say
input: { address: map, text: string }
allow: ["send:.rook/bridges/*/say"]
stages:
  say:
    job: { call: { at: ".rook/bridges/${input.address.bridge}/say" }, input: { to: "${input.address.id}", text: "${input.text}", answers: "${input.address.answers}" } }
output: ${stages.say.output}
