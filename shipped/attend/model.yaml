# The Attend slot, filled by asking a small model whether a message that does not
# name the bot is meant for it, given the thread before it. It says no when
# unsure, so people talking to each other get no reply. `about`, by default a
# bot that answers the people it belongs to, says what the bot is for.
flow: attend-model
input:
  said: string
  asker: string
  address: map
  history: "any?"
  about: "string?"
stages:
  decide:
    job:
      input: { said: "${input.said}", asker: "${input.asker}", history: "${input.history || ''}", about: "${input.about || 'a bot that answers questions and does tasks for the people it belongs to'}" }
      machine:
        agent: attend
        input: { said: string, asker: string, history: string, about: string }
        model: { name: haiku, service: claude-code, secret: CLAUDE_TOKEN }
        system: |
          You are shown the newest message in a thread, the thread before it, and
          what a bot in the thread is for. Answer true when the newest message is
          meant for the bot: it asks the bot for something, answers what the bot
          last said, or is the kind of message the bot is for. Answer false when
          people are talking to each other, and when you are unsure.
        prompt: "The bot is ${input.about}.\n\n${input.history ? 'The thread before the message, where the bot is called you:\\n<thread>\\n' + input.history + '\\n</thread>' : 'The message starts the thread.'}\n\nThe newest message, from ${input.asker}:\n<message>\n${input.said}\n</message>"
        reply:
          type: object
          required: [answer]
          additionalProperties: false
          properties:
            answer: { type: boolean }
output: "${ { answer: stages.decide.output.reply.answer } }"
