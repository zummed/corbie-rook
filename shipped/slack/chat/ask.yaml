# Rook's question on Slack, which an approval calls, and any machine may. It
# posts `text` in `in`, a channel's #name, a conversation, or either with
# /thread, with a button for each of `choices`, and waits. A press counts when
# the presser's scopes, as the lookup at `lookup` gives them, hold `approvers`,
# and the presser's email is not `asker`. Anyone else who presses is told why,
# and the buttons stay. The first press that counts takes the buttons away and
# ends the question with { choice, by }, `by` being the presser's name. With no
# press that counts within `within`, by default a week, it ends with
# { choice: no }. Each button holds this run's ID, and the router sends a press
# to it.
#
# Each service's chat/ask is this statechart, with the service's script doing
# three things: ask posts the buttons and gives `sent`, tell tells a presser
# `text` given the press and `sent`, and close shows `text` in place of the
# buttons, given `sent` and, after a press that counts, that press.
statechart: slack-chat-ask
description: Asks a question on Slack with a button for each choice, and gives the first choice pressed by someone whose scopes hold the approvers.
title: "${input.text.split('\\n')[0]}"
# The placed file fixes `router`, the router whose answers the question takes,
# and `lookup`, each with const: and default:, so no caller gives either. An
# answer from any other location is dropped.
input:
  type: object
  required: [in, text, choices, approvers, router, lookup]
  properties:
    in: { type: string }
    text: { type: string }
    choices: { type: array }
    approvers: { type: string }
    asker: { type: string }
    within: { type: string }
    router: { type: string }
    lookup: { type: string }
initial: asking
states:
  asking:
    defer: [answer]
    job:
      script: .rook/slack/slack.js
      input: { do: ask, in: "${input.in}", text: "${input.text}", choices: "${input.choices}", question: "${run.id.slice(run.id.indexOf('/') + 1)}" }
      allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
      restart: { limit: 2 }
    on: { done: open }
  open:
    timers: { unanswered: "${input.within || '7d'}" }
    initial: waiting
    states:
      waiting:
        on: { answer: { go: checking, when: "${event.from.at === run.tree + '/' + input.router}" } }
      checking:
        defer: [answer]
        job:
          machine: .rook/shared/press.yaml
          input: { answer: "${event.data}", lookup: "${input.lookup}", approvers: "${input.approvers}", asker: "${input.asker || ''}", choices: "${input.choices}" }
        on:
          done:
            - { go: answered, when: "${event.data.counts}" }
            - { go: telling, when: "${event.data.tell !== ''}" }
            - waiting
          failed: waiting
      telling:
        defer: [answer]
        job:
          script: .rook/slack/slack.js
          input: { do: tell, sent: "${states.asking.output.sent}", answer: "${states.checking.output.answer}", text: "${states.checking.output.tell}" }
          allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
        on: { done: waiting, failed: waiting }
    on: { unanswered: unanswered }
  answered:
    job:
      script: .rook/slack/slack.js
      input: { do: close, sent: "${states.asking.output.sent}", answer: "${states.checking.output.answer}", text: "${input.text + '\\n\\n' + states.checking.output.by + ' said ' + states.checking.output.choice + '.'}" }
      allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
      restart: { limit: 2 }
    on: { done: over, failed: over }
  over: { end: done, output: { choice: "${states.checking.output.choice}", by: "${states.checking.output.by}" } }
  unanswered:
    job:
      script: .rook/slack/slack.js
      input: { do: close, sent: "${states.asking.output.sent}", text: "${input.text + '\\n\\nNo one answered in time, so the answer is no.'}" }
      allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
      restart: { limit: 2 }
    on: { done: expired, failed: expired }
  expired: { end: done, output: { choice: "no" } }
