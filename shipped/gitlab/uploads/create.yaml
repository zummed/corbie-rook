# `to` is project#iid.
flow: gitlab-uploads-create
description: Uploads a file to a GitLab issue and writes a comment that links to it.
input: { to: string, name: string, file: blob }
stages:
  send:
    job:
      script: .rook/gitlab/gitlab.js
      files: [.rook/gitlab/api.js]
      input: { do: send, to: "${input.to}", name: "${input.name}", file: "${input.file}", site: "${values.GITLAB_SITE}" }
      allow: ["net:${values.GITLAB_SITE}", "secret:GITLAB_TOKEN@net:${values.GITLAB_SITE}"]
      timeout: 5m
output: ${stages.send.output}
