flow: gitlab-issues-notes-create
description: Writes a comment on a GitLab issue, in Markdown, each chart as its table.
input:
  type: object
  properties:
    project: { type: string, description: "the project's path, as group/project" }
    iid: { type: number, description: "the issue's number in its project" }
    body: { type: string, description: the comment, in Markdown }
  required: [project, iid, body]
stages:
  note:
    job:
      script: .rook/gitlab/gitlab.js
      files: [.rook/gitlab/api.js, .rook/shared/rich.js]
      input: { do: note, project: "${input.project}", iid: "${input.iid}", body: "${input.body}", site: "${values.GITLAB_SITE}" }
      allow: ["net:${values.GITLAB_SITE}", "secret:GITLAB_TOKEN@net:${values.GITLAB_SITE}"]
      restart: { limit: 2 }
output: ${stages.note.output}
