# `in` is project#iid. It writes the comment with issues/notes/create.
flow: gitlab-chat-post
description: Posts a text as a comment on a GitLab issue, in Markdown.
input: { in: string, text: string }
stages:
  post: { job: { machine: .rook/gitlab/issues/notes/create.yaml, input: { to: "${input.in}", text: "${input.text}" } } }
output: ${stages.post.output}
