# Rook's question on GitLab, which an approval calls, and any machine may. It
# is Slack's chat/ask with GitLab's script: it writes `text` as a comment on
# the issue `in`, project#iid, that asks for a comment saying one of
# `choices`. The listener sends such a comment, matching a choice in any case,
# to its router as an answer, and the router sends it here. An answer counts
# when the person's scopes, by the lookup at `lookup`, hold `approvers`, and
# the person's email is not `asker`'s; anyone else is told why in a comment,
# and the question waits on. The first answer that counts closes the question
# with a comment, and the run ends with { choice, by }. No answer that counts
# within `within`, by default a week, closes it and ends with { choice: no }.
statechart: gitlab-chat-ask
description: Asks a question in a comment on a GitLab issue, and gives the first choice answered by someone whose scopes hold the approvers.
title: "${input.in}: ${input.text.split('\\n')[0]}"
# The placed file fixes `router`, the router whose answers the question takes,
# and `lookup`, each with const: and default:, so no caller gives either. An
# answer from any other location is dropped.
input:
  type: object
  required: [in, text, choices, approvers, router, lookup]
  properties:
    in: { type: string }
    text: { type: string }
    choices: { type: array }
    approvers: { type: string }
    asker: { type: string }
    within: { type: string }
    router: { type: string }
    lookup: { type: string }
initial: asking
states:
  asking:
    defer: [answer]
    job:
      script: .rook/gitlab/gitlab.js
      files: [.rook/gitlab/api.js]
      input: { do: ask, in: "${input.in}", text: "${input.text}", choices: "${input.choices}", question: "${run.id.slice(run.id.indexOf('/') + 1)}", site: "${values.GITLAB_SITE}" }
      allow: ["net:${values.GITLAB_SITE}", "secret:GITLAB_TOKEN@net:${values.GITLAB_SITE}"]
      restart: { limit: 2 }
    on: { done: open }
  open:
    timers: { unanswered: "${input.within || '7d'}" }
    initial: waiting
    states:
      waiting:
        on: { answer: { go: checking, when: "${event.from.at === run.tree + '/' + input.router}" } }
      checking:
        defer: [answer]
        job:
          machine: .rook/shared/press.yaml
          input: { answer: "${event.data}", lookup: "${input.lookup}", approvers: "${input.approvers}", asker: "${input.asker || ''}", choices: "${input.choices}" }
        on:
          done:
            - { go: answered, when: "${event.data.counts}" }
            - { go: telling, when: "${event.data.tell !== ''}" }
            - waiting
          failed: waiting
      telling:
        defer: [answer]
        job:
          script: .rook/gitlab/gitlab.js
          files: [.rook/gitlab/api.js]
          input: { do: tell, sent: "${states.asking.output.sent}", answer: "${states.checking.output.answer}", by: "${states.checking.output.by}", text: "${states.checking.output.tell}", site: "${values.GITLAB_SITE}" }
          allow: ["net:${values.GITLAB_SITE}", "secret:GITLAB_TOKEN@net:${values.GITLAB_SITE}"]
        on: { done: waiting, failed: waiting }
    on: { unanswered: unanswered }
  answered:
    job:
      script: .rook/gitlab/gitlab.js
      files: [.rook/gitlab/api.js]
      input: { do: close, sent: "${states.asking.output.sent}", answer: "${states.checking.output.answer}", text: "${states.checking.output.by + ' answered ' + states.checking.output.choice + '.'}", site: "${values.GITLAB_SITE}" }
      allow: ["net:${values.GITLAB_SITE}", "secret:GITLAB_TOKEN@net:${values.GITLAB_SITE}"]
      restart: { limit: 2 }
    on: { done: over, failed: over }
  over: { end: done, output: { choice: "${states.checking.output.choice}", by: "${states.checking.output.by}" } }
  unanswered:
    job:
      script: .rook/gitlab/gitlab.js
      files: [.rook/gitlab/api.js]
      input: { do: close, sent: "${states.asking.output.sent}", text: "No one answered in time, so the answer is no.", site: "${values.GITLAB_SITE}" }
      allow: ["net:${values.GITLAB_SITE}", "secret:GITLAB_TOKEN@net:${values.GITLAB_SITE}"]
      restart: { limit: 2 }
    on: { done: expired, failed: expired }
  expired: { end: done, output: { choice: "no" } }
