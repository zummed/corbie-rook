# `in` is the chat. The first part answers the message `answers` names.
flow: telegram-chat-post
description: Posts a text in a Telegram chat, each chart as its table.
input: { in: string, text: string, answers: "any?" }
stages:
  say:
    job:
      script: .rook/telegram/telegram.js
      files: [.rook/shared/rich.js]
      input: { do: say, token: TELEGRAM_TOKEN, to: "${input.in}", text: "${input.text}", answers: "${input.answers}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      restart: { limit: 2 }          # Telegram sometimes drops a connection; a resend can repeat a message, never lose one
output: ${stages.say.output}
