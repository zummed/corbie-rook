# Rook's later, which an agent's tool `later` starts, one run for each
# reminder. After `minutes` it sends the conversation's run at `back` a
# message from the person the reminder was set for, its text the note and
# `later` the minutes it waited, so that the agent takes a turn and does what
# the note says. The tool fixes `back` and `message`, and the model chooses
# only `minutes` and `note`.
#
#   minutes   how long it waits: rounded, and held from 1 to 1440, a day
#   note      what the agent is to do then
#   back      the conversation's run, { at, key }, which the conversation gives the agent
#   message   the service, place, chat, user, name, email and answers of the
#             message the reminder was set in
#
# A conversation that ended in the meantime starts again with the reminder,
# and no earlier turns. At most 20 reminders wait at once in a project, and a
# stop does not cancel one.
statechart: later
description: Brings a conversation back after a wait, with a note of what to do then.
lifetime: keyed
limits: { runs: 20 }
receive: [agents/*]
allow: ["send:${input.back.at}"]
title: "${'In ' + input.minutes + ' minutes: ' + input.note}"
initial: waiting
states:
  waiting:
    timers: { due: "${Math.min(Math.max(Math.round(Number(input.minutes)) || 1, 1), 1440) + 'm'}" }
    # `later` is the minutes the timer waited, the same sum as the timer's.
    on:
      due:
        go: sent
        send:
          to: "${input.back}"
          event: message
          data: "${Object.assign({}, input.message, { text: String(input.note), later: Math.min(Math.max(Math.round(Number(input.minutes)) || 1, 1), 1440) })}"
  sent: { end: done }
