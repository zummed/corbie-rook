# GitLab's listener, which bridges/gitlab.yaml includes: it asks each project
# what happened, every thirty seconds, since GitLab cannot be asked to wait. An
# issue opened or a comment on an issue that names the bot goes to that issue's
# run at .rook/blocks/chat, keyed gitlab:<project>#<issue>, and with overhear
# every other one, marked unaddressed. An opened issue goes once nobody has
# changed it for settle. Its first ask marks where each project stands, and hears
# nothing. The host is the value GITLAB_SITE, and the token the secret
# GITLAB_TOKEN.
title: GitLab listener
input:
  projects: list
  overhear: "boolean?"
  settle: "string?"
allow: [send:.rook/blocks/chat]
initial: hearing
states:
  hearing:
    job:
      script: ./gitlab.js
      files: [./api.js, .rook/blocks/types.js]
      input: { do: hear, site: "${values.GITLAB_SITE}", projects: "${input.projects}", overhear: "${input.overhear || false}", settle: "${input.settle || '0s'}", cursor: "${states.hearing.output ? states.hearing.output.cursor : null}" }
      allow: ["net:${values.GITLAB_SITE}", "secret:GITLAB_TOKEN@net:${values.GITLAB_SITE}"]
      timeout: 2m
    on:
      message: { send: { to: { at: .rook/blocks/chat, key: "gitlab:${event.data.chat}" }, event: message, data: "${event.data}" } }
      done: resting
      failed: resting
  resting:
    timers: { again: 30s }
    on: { again: hearing }
