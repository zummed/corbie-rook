# What was said before a comment on a GitLab issue: `to` is project#iid, and `at`
# the comment.
flow: gitlab-history
input: { to: string, at: "any?" }
stages:
  read:
    job:
      script: ./gitlab.js
      files: [./api.js, .rook/blocks/thread.js, .rook/blocks/types.js]
      input: { do: history, to: "${input.to}", at: "${input.at}", site: "${values.GITLAB_SITE}" }
      allow: ["net:${values.GITLAB_SITE}", "secret:GITLAB_TOKEN@net:${values.GITLAB_SITE}"]
      timeout: 20s
output: ${stages.read.output}
