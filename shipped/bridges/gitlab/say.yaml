# Says a text as a comment on a GitLab issue, each chart as its table: `to` is
# project#iid.
flow: gitlab-say
input: { to: string, text: string }
stages:
  say:
    job:
      script: ./gitlab.js
      files: [./api.js, .rook/blocks/rich.js]
      input: { do: say, to: "${input.to}", text: "${input.text}", site: "${values.GITLAB_SITE}" }
      allow: ["net:${values.GITLAB_SITE}", "secret:GITLAB_TOKEN@net:${values.GITLAB_SITE}"]
      restart: { limit: 2 }
output: ${stages.say.output}
