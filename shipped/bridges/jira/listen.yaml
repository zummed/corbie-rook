# Jira's listener, which bridges/jira.yaml includes: it asks each project what
# changed, every thirty seconds. An issue opened or a comment that names the bot
# goes to that issue's run at .rook/blocks/chat, keyed jira:<issue>, and with
# overhear every other one, marked unaddressed. An opened issue goes once nobody
# has changed it for settle. Its first ask marks the time, and hears nothing. It
# signs in at the value JIRA_SITE as the value JIRA_EMAIL, with the API token
# that is the secret JIRA_TOKEN.
title: Jira listener
input:
  projects: list
  overhear: "boolean?"
  settle: "string?"
allow: [send:.rook/blocks/chat]
initial: hearing
states:
  hearing:
    job:
      script: ./jira.js
      files: [./api.js]
      input: { do: hear, site: "${values.JIRA_SITE}", email: "${values.JIRA_EMAIL}", projects: "${input.projects}", overhear: "${input.overhear || false}", settle: "${input.settle || '0s'}", cursor: "${states.hearing.output ? states.hearing.output.cursor : null}" }
      allow: ["net:${values.JIRA_SITE}", "secret:JIRA_TOKEN@net:${values.JIRA_SITE}"]
      timeout: 2m
    on:
      message: { send: { to: { at: .rook/blocks/chat, key: "jira:${event.data.chat}" }, event: message, data: "${event.data}" } }
      done: resting
      failed: resting
  resting:
    timers: { again: 30s }
    on: { again: hearing }
