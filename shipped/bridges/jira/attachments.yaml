# Downloads the files on a Jira issue that a message has, each at most 32 MiB.
# A larger file is given without its contents.
flow: jira-attachments
input: { attachments: list }
stages:
  download:
    job:
      script: ./jira.js
      files: [./api.js]
      input: { do: attachments, attachments: "${input.attachments}", most: 33554432, site: "${values.JIRA_SITE}", email: "${values.JIRA_EMAIL}" }
      allow: ["net:${values.JIRA_SITE}", "secret:JIRA_TOKEN@net:${values.JIRA_SITE}"]
      timeout: 5m
output: ${stages.download.output}
