# Says a text as a comment on a Jira issue, each chart as its table: `to` is its
# key, such as OPS-12.
flow: jira-say
input: { to: string, text: string }
stages:
  say:
    job:
      script: ./jira.js
      files: [./api.js, .rook/blocks/rich.js]
      input: { do: say, to: "${input.to}", text: "${input.text}", site: "${values.JIRA_SITE}", email: "${values.JIRA_EMAIL}" }
      allow: ["net:${values.JIRA_SITE}", "secret:JIRA_TOKEN@net:${values.JIRA_SITE}"]
      restart: { limit: 2 }
output: ${stages.say.output}
