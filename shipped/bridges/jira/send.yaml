# Sends a file to a Jira issue, under a name: it is attached, and a comment shows
# it. `to` is the issue's key, such as OPS-12.
flow: jira-send
input: { to: string, name: string, file: blob, site: string, email: string }
stages:
  send:
    job:
      script: ./jira.js
      files: [./api.js]
      input: { do: send, to: "${input.to}", name: "${input.name}", file: "${input.file}", site: "${input.site}", email: "${input.email}" }
      allow: ["net:${input.site}", "secret:JIRA_TOKEN@net:${input.site}"]
      timeout: 5m
output: ${stages.send.output}
