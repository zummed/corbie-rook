# Downloads the files sent with a Telegram message, each at most `most` bytes.
flow: telegram-attachments
input: { attachments: list, most: number }
stages:
  download:
    job:
      script: ./telegram.js
      input: { do: attachments, token: TELEGRAM_TOKEN, attachments: "${input.attachments}", most: "${input.most}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      timeout: 5m
output: ${stages.download.output}
