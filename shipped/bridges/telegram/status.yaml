# Shows that the bot is typing in a Telegram chat, for any text but an empty one.
# A late status is worse than none, so it is not tried again.
flow: telegram-status
input: { to: string, text: string }
stages:
  status:
    job:
      script: ./telegram.js
      input: { do: status, token: TELEGRAM_TOKEN, to: "${input.to}", text: "${input.text}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      timeout: 20s
