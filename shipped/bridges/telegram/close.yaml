# Shows `text` in place of the questions a Telegram ask posted, with no buttons.
flow: telegram-close
input: { sent: list, text: string }
stages:
  close:
    job:
      script: ./telegram.js
      input: { do: close, token: TELEGRAM_TOKEN, sent: "${input.sent}", text: "${input.text}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      restart: { limit: 2 }
