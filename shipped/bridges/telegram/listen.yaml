# Telegram's listener, which bridges/telegram.yaml includes: it asks for each
# new update. Each message, and /stop as a stop, goes to its chat's run at
# .rook/blocks/chat, keyed telegram:<chat>, which starts when the chat has none.
# Each tap on a button goes to the question's run at .rook/blocks/ask. A button
# holds the run's ID without its client's name, since Telegram keeps 64 bytes,
# and this adds the name back.
title: Telegram listener
input: { type: object, additionalProperties: false }   # it takes no input, such as overhear
allow: [send:.rook/blocks/chat, send:.rook/blocks/ask]
initial: hearing
states:
  hearing:
    job:
      script: ./telegram.js
      input:
        do: hear
        token: TELEGRAM_TOKEN
        cursor: "${states.hearing.output ? states.hearing.output.cursor : null}"
        failing: "${states.hearing.output ? states.hearing.output.failing : null}"
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      timeout: 2m
    on:
      message: { send: { to: { at: .rook/blocks/chat, key: "telegram:${event.data.chat}" }, event: message, data: "${event.data}" } }
      stop: { send: { to: { at: .rook/blocks/chat, key: "telegram:${event.data.chat}" }, event: stop, data: "${event.data}" } }
      answer: { send: { to: { at: .rook/blocks/ask, run: "${run.id.slice(0, run.id.indexOf('/') + 1) + event.data.question}" }, event: answer, data: "${event.data}" } }
      done: hearing
      failed: resting
  resting:
    timers: { again: 1m }
    on: { again: hearing }
