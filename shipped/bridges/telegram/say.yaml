# Says a text in a Telegram chat, the first part in reply to the message it
# answers, and each chart as its table.
flow: say
input: { to: string, text: string, answers: "any?" }
stages:
  say:
    job:
      script: ./telegram.js
      files: [.rook/blocks/rich.js]
      input: { do: say, token: TELEGRAM_TOKEN, to: "${input.to}", text: "${input.text}", answers: "${input.answers}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      restart: { limit: 2 }          # Telegram sometimes drops a connection; a resend can repeat a message, never lose one
output: ${stages.say.output}
