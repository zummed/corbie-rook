# Shows Slack's "Working..." and its stop button under a Slack thread, for any
# text but an empty one, which clears them: `to` is conversation/thread. A late
# status is worse than none, so it is not tried again.
flow: slack-status
input: { to: string, text: string }
stages:
  status:
    job:
      script: ./slack.js
      input: { do: status, to: "${input.to}", text: "${input.text}" }
      allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
      timeout: 20s
