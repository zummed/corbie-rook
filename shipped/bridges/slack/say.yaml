# Says a text on Slack, drawing its charts: `to` is a conversation, a channel's
# #name, or either with /thread. The text is cut into the messages Slack takes,
# which are posted in order, each tried again on its own after a failure, so
# that none is posted twice.
flow: slack-say
input: { to: string, text: string }
stages:
  cut:
    job:
      script: ./slack.js
      files: [.rook/blocks/rich.js]
      input: { do: cut, text: "${input.text}" }
  say:
    each: { items: "${stages.cut.output}", serial: true }
    job:
      script: ./slack.js
      input: { do: say, to: "${input.to}", message: "${item}" }
      allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
      restart: { limit: 2 }
