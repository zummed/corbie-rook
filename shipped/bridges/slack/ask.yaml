# Asks on Slack, with a button for each choice: `to` lists people's ids, each
# asked in a direct message, and channels, as #name, asked there. It gives `sent`,
# the messages it posted.
flow: slack-ask
input: { to: list, text: string, choices: list, question: string }
stages:
  question:
    job:
      script: ./slack.js
      input: { do: ask, to: "${input.to}", text: "${input.text}", choices: "${input.choices}", question: "${input.question}" }
      allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
      restart: { limit: 2 }
output: ${stages.question.output}
