# Asks people on Slack in a direct message, with a button for each choice.
flow: slack-ask
input: { to: list, text: string, choices: list, question: string }
stages:
  question:
    job:
      script: ./slack.js
      input: { do: ask, to: "${input.to}", text: "${input.text}", choices: "${input.choices}", question: "${input.question}" }
      allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
      restart: { limit: 2 }
