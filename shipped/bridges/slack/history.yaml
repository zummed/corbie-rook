# What was said before a message in a Slack thread or direct message: `to` is a
# conversation, or conversation/thread, and `at` the message.
flow: slack-history
input: { to: string, at: "any?" }
stages:
  read:
    job:
      script: ./slack.js
      files: [.rook/blocks/thread.js]
      input: { do: history, to: "${input.to}", at: "${input.at}" }
      allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
      timeout: 20s
output: ${stages.read.output}
